<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OIL India Safety Reporting System – PS 26165 | Industrial HSSE Portal</title>
    <meta name="description" content="Official Unsafe Condition (UC) and Unsafe Event (UE) Industrial Safety Reporting and Area-wise Bifurcation Management System for Oil India Limited PS 26165." />
  </head>
  <body>
    <div id="error-overlay" style="display:none; position:fixed; z-index:9999; top:0; left:0; width:100%; padding:20px; background:red; color:white; font-family:monospace; white-space:pre-wrap;"></div>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText = 'GLOBAL ERROR:\\n' + msg + '\\n' + (error && error.stack ? error.stack : '');
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText = 'UNHANDLED PROMISE REJECTION:\\n' + event.reason;
      });
      const origError = console.error;
      console.error = function(...args) {
        origError.apply(console, args);
        if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('Unhandled React Error')) return; // handled by error boundary
        document.getElementById('error-overlay').style.display = 'block';
        document.getElementById('error-overlay').innerText += 'CONSOLE.ERROR:\\n' + args.map(a => (a && a.stack ? a.stack : String(a))).join(' ') + '\\n\\n';
      };
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
